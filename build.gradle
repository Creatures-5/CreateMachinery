buildscript {
    configurations.classpath {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

plugins {
    id "architectury-plugin" version "3.4.+"
    id "dev.architectury.loom" version "1.10.+" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    repositories {
        maven { url = 'https://maven.parchmentmc.org' } //Parchment mappings

        maven { url = "https://maven.blamejared.com/" } // JEI

        maven { url = "https://maven.tterrag.com/" } // Flywheel on both, Create and Registrate on forge

        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://dvs1.progwml6.com/files/maven/" }
        maven { url = "<https://maven.shedaniel.me/>" }
        maven { url = "<https://maven.architectury.dev/>" }
        maven { url = "https://cursemaven.com" }
        maven { url = "https://maven.wispforest.io/releases" }

        maven { url = "https://nexus.resourcefulbees.com/repository/maven-public/" } //required for bamboo bee
        maven { url = "https://maven.teamresourceful.com/repository/maven-public/" }
        
        maven { url = "https://maven.conczin.net/Artifacts" } //Immersive Aircraft        
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.architectury.minecraft}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment_version}@zip")
        }
    }
}


def getAppVersion = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'tag', '--points-at', 'HEAD'
            standardOutput = stdout
        }
        def tag = stdout.toString().trim()
        if (tag.isEmpty()) {
            return rootProject.minecraft_version + "-SNAPSHOT"
        }
        return tag
    } catch (Exception e) {
        println "Warning: ${e.message}, is git installed?"
        return rootProject.minecraft_version + "-DEV"
    }
} as Object


allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.archives_base_name
    version = getAppVersion()

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }

    def exclusionPatterns = ['**/*.aup3', '**/.xdp-*', '**/*.kra', '**/*~*']
    processResources {
        exclusionPatterns.each { pattern ->
            exclude pattern
        }
    }
    sourcesJar {
        exclusionPatterns.each { pattern ->
            exclude pattern
        }
    }
}